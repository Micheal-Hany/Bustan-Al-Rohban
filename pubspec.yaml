name: bustan_al_rohban
description: "بستان الرهبان - Arabic-first reader and study app (offline-first, book-only AI assistant)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_bloc: ^8.1.6
  go_router: ^14.2.0
  crypto: ^3.0.3
  # Spike S1 only (TTS feasibility); revisit in Task 8.
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/content/saints/
    # Debug-only invalid fixture; removed from release builds in Task 13.
    - assets/content_fixtures/invalid/
    - assets/content_fixtures/invalid/saints/
  # Arabic font: see assets/fonts/README.md. Uncomment AFTER adding the font
  # files, otherwise the build fails on missing assets.
  # fonts:
  #   - family: NotoNaskhArabic
  #     fonts:
  #       - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
  #       - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
  #         weight: 700
