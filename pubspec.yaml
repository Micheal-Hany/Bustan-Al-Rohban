name: bustan_al_rohban
description: "بستان الرهبان - Arabic-first reader and study app (offline-first, book-only AI assistant)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_bloc: ^8.1.6
  go_router: ^14.2.0
  crypto: ^3.0.3
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  scrollable_positioned_list: ^0.3.8
  # Spike S1 only (TTS feasibility); revisit in Task 8.
  flutter_tts: ^4.2.5
  iconsax_flutter: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12
  sqlite3: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/content/saints/
    # Debug-only invalid fixture; removed from release builds in Task 13.
    - assets/content_fixtures/invalid/
    - assets/content_fixtures/invalid/saints/
  fonts:
    # Amiri: classical naskh for book text. Tajawal: clean UI sans. Both SIL OFL.
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
