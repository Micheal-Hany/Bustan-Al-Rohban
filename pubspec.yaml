name: bustan_al_rohban
description: "بستان الرهبان - Arabic-first reader and study app (offline-first, book-only AI assistant)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_bloc: ^8.1.6
  go_router: ^14.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Arabic font: see assets/fonts/README.md. Uncomment AFTER adding the font
  # files, otherwise the build fails on missing assets.
  # fonts:
  #   - family: NotoNaskhArabic
  #     fonts:
  #       - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
  #       - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
  #         weight: 700
